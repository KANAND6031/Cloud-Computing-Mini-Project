apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
  labels:
    app: teacher-worker
    shard: "0"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: teacher-worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: TEACHER_URL
              value: "http://host.k3d.internal:11434"
            - name: AWS_ACCESS_KEY_ID
              value: "any"
            - name: AWS_SECRET_ACCESS_KEY
              value: "any"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-1
  namespace: pipeline
  labels:
    app: teacher-worker
    shard: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: teacher-worker
        shard: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: cloud-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: TEACHER_URL
              value: "http://host.k3d.internal:11434"
            - name: AWS_ACCESS_KEY_ID
              value: "any"
            - name: AWS_SECRET_ACCESS_KEY
              value: "any"
