apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: app
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "any"
  AWS_SECRET_ACCESS_KEY: "any"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: app
  labels:
    app: inference-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      containers:
      - name: inference
        image: cloud-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_URI
          value: "s3://models/v1/model.tar.gz"
        - name: MODEL_VERSION
          value: "v1"
        - name: S3_ENDPOINT
          value: "http://seaweedfs.data.svc.cluster.local:8333"
        - name: MAX_NEW_TOKENS
          value: "64"
        - name: FAULT_INJECT
          value: "0"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-credentials
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: app
  labels:
    app: inference-service
spec:
  type: ClusterIP
  selector:
    app: inference-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inference-ingress
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - http:
      paths:
      - path: /parse
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000
      - path: /healthz
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000
      - path: /readyz
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000
